<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fruit Cutting Game</title>

<style>

body{
margin:0;
overflow:hidden;
background:#222;
font-family:Arial;
}

canvas{
display:block;
}

#score{
position:absolute;
top:10px;
left:20px;
color:white;
font-size:26px;
}

</style>

</head>

<body>

<div id="score">Score:0</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let fruits=[]
let pieces=[]
let particles=[]

let score=0

let mouseX=0
let mouseY=0
let slicing=false

let trail=[]

const fruitList=["🍎","🍉","🍊","🍌","🍍","🥝"]

/* FRUIT */

class Fruit{

constructor(){

this.x=Math.random()*canvas.width
this.y=-60

this.speed=3+Math.random()*3

this.radius=35

this.type=Math.random()<0.15?"bomb":"fruit"

this.emoji=this.type==="bomb"?"💣":fruitList[Math.floor(Math.random()*fruitList.length)]

}

draw(){

ctx.font="50px Arial"
ctx.fillText(this.emoji,this.x-25,this.y+25)

}

update(){

this.y+=this.speed

this.draw()

}

}

/* CUT PIECES */

class Piece{

constructor(x,y,vx,emoji){

this.x=x
this.y=y

this.vx=vx
this.vy=-3

this.gravity=0.5

this.emoji=emoji

}

draw(){

ctx.font="40px Arial"
ctx.fillText(this.emoji,this.x,this.y)

}

update(){

this.vy+=this.gravity

this.x+=this.vx
this.y+=this.vy

this.draw()

}

}

/* JUICE PARTICLES */

class Particle{

constructor(x,y){

this.x=x
this.y=y

this.vx=(Math.random()-0.5)*8
this.vy=(Math.random()-0.5)*8

this.life=30

}

draw(){

ctx.fillStyle="red"

ctx.beginPath()

ctx.arc(this.x,this.y,3,0,Math.PI*2)

ctx.fill()

}

update(){

this.x+=this.vx
this.y+=this.vy

this.life--

this.draw()

}

}

/* SPAWN */

function spawnFruit(){

fruits.push(new Fruit())

}

setInterval(spawnFruit,900)

/* SLICE TRAIL */

function drawTrail(){

ctx.beginPath()

for(let i=0;i<trail.length;i++){

ctx.lineTo(trail[i].x,trail[i].y)

}

ctx.strokeStyle="white"

ctx.lineWidth=6

ctx.stroke()

}

/* GAME LOOP */

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

drawTrail()

/* FRUITS */

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i]

f.update()

let dx=mouseX-f.x
let dy=mouseY-f.y

let dist=Math.sqrt(dx*dx+dy*dy)

if(dist<f.radius && slicing){

if(f.type==="bomb"){

alert("GAME OVER")

location.reload()

}else{

score++

document.getElementById("score").innerText="Score:"+score

/* SPLIT */

pieces.push(new Piece(f.x,f.y,-5,f.emoji))
pieces.push(new Piece(f.x,f.y,5,f.emoji))

/* SPLASH */

for(let p=0;p<12;p++){

particles.push(new Particle(f.x,f.y))

}

}

fruits.splice(i,1)

}

if(f.y>canvas.height+100){

fruits.splice(i,1)

}

}

/* PIECES */

for(let i=pieces.length-1;i>=0;i--){

pieces[i].update()

if(pieces[i].y>canvas.height){

pieces.splice(i,1)

}

}

/* PARTICLES */

for(let i=particles.length-1;i>=0;i--){

particles[i].update()

if(particles[i].life<=0){

particles.splice(i,1)

}

}

requestAnimationFrame(animate)

}

animate()

/* MOUSE */

canvas.addEventListener("mousemove",e=>{

mouseX=e.clientX
mouseY=e.clientY

if(slicing){

trail.push({x:mouseX,y:mouseY})

if(trail.length>20) trail.shift()

}

})

canvas.addEventListener("mousedown",()=>{

slicing=true
trail=[]

})

canvas.addEventListener("mouseup",()=>{

slicing=false
trail=[]

})

/* TOUCH */

canvas.addEventListener("touchmove",e=>{

mouseX=e.touches[0].clientX
mouseY=e.touches[0].clientY

if(slicing){

trail.push({x:mouseX,y:mouseY})

if(trail.length>20) trail.shift()

}

})

canvas.addEventListener("touchstart",()=>{

slicing=true
trail=[]

})

canvas.addEventListener("touchend",()=>{

slicing=false
trail=[]

})

</script>

</body>
</html>
