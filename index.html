<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Cutting Game</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#1e90ff;
  font-family:Arial;
}
canvas{ display:block; }

/* HOME ICON */
#menuIcon{
  position:absolute;
  top:10px;
  right:15px;
  font-size:30px;
  cursor:pointer;
  z-index:1000;
}
/* MENU PANEL */
#menuPanel{
  position:absolute;
  top:50px;
  right:10px;
  background:white;
  border-radius:10px;
  padding:10px;
  display:none;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
  z-index:1000;
}
#menuPanel button{
  display:block;
  margin:5px 0;
  width:160px;
  padding:8px;
  border:none;
  background:#ff9800;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

#score{ position:absolute; top:10px; left:20px; font-size:22px; color:white; text-shadow:2px 2px black;}
#lives{ position:absolute; top:40px; left:20px; font-size:20px; color:red;}
#highscore{ position:absolute; top:70px; left:20px; font-size:18px; color:yellow;}
#startScreen{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;}
#startBtn,#restartBtn{
  padding:15px 30px;
  font-size:20px;
  border:none;
  border-radius:8px;
  background:#ff9800;
  color:white;
  cursor:pointer;
}
#restartBtn{ display:none; }
</style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e90ff">
</head>

<body>

<!-- HOME ICON -->
<div id="menuIcon">🏠</div>

<!-- MENU -->
<div id="menuPanel">
  <button onclick="showAbout()">About</button>
  <button onclick="showPrivacy()">Privacy Policy</button>
  <button onclick="showContact()">Contact</button>
</div>

<div id="score">Score: 0</div>
<div id="lives">Lives: ❤️❤️❤️</div>
<div id="highscore">High Score: 0</div>

<div id="startScreen">
<h1 style="color:white">FRUIT CUTTING GAME</h1>
<button id="startBtn">START GAME</button>
<br><br>
<button id="restartBtn">RESTART</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas=document.getElementById("gameCanvas")
const ctx=canvas.getContext("2d")
canvas.width=window.innerWidth
canvas.height=window.innerHeight

let score=0, lives=3, items=[], pieces=[], gameRunning=false, speed=3
let mouseX=0, mouseY=0, mouseDown=false, trail=[]
const scoreText=document.getElementById("score")
const livesText=document.getElementById("lives")
const highScoreText=document.getElementById("highscore")
const startBtn=document.getElementById("startBtn")
const restartBtn=document.getElementById("restartBtn")
let highScore=localStorage.getItem("fruitHighScore") || 0
highScoreText.innerText="High Score: "+highScore

// HOME MENU
const menuIcon=document.getElementById("menuIcon")
const menuPanel=document.getElementById("menuPanel")
menuIcon.addEventListener("click",()=>{menuPanel.style.display = menuPanel.style.display==="block"?"none":"block"})

function showAbout(){ alert("ABOUT GAME\n\nFruit Cutting Game is a fun arcade slicing game.\nSlice fruits and avoid bombs.\n\nDeveloped by Pavitra Bhargav.") }
function showPrivacy(){ alert("PRIVACY POLICY\n\nThis game does not collect any personal data.\nHigh score is stored only on your device.") }
function showContact(){ alert("CONTACT\n\nEmail: pavitrabhargav@gmail.com") }

// SLICE TRAIL
function drawTrail(){
  if(trail.length<2) return
  ctx.beginPath()
  ctx.moveTo(trail[0].x, trail[0].y)
  for(let i=1;i<trail.length;i++) ctx.lineTo(trail[i].x, trail[i].y)
  ctx.strokeStyle="white"
  ctx.lineWidth=4
  ctx.stroke()
}

// IMAGES
let bombImg=new Image()
bombImg.src="bomb.png"

// AUDIO
let blastSound=new Audio("blast.mp3")
let cutSound=new Audio("cut.mp3")
let bgMusic=new Audio("backgroundaudio.mp3")
bgMusic.loop=true

// FRUITS
let fruits=["🍎","🍉","🍌","🍇","🍊","🍍"]

class Item{
  constructor(x){
    this.x=x; this.y=-50; this.radius=30
    this.type=Math.random()<0.2?"bomb":"fruit"
    this.emoji=fruits[Math.floor(Math.random()*fruits.length)]
    this.speed=speed+Math.random()*2
  }
  draw(){
    if(this.type==="bomb"){ ctx.drawImage(bombImg,this.x-30,this.y-30,60,60) }
    else{ ctx.font="45px Arial"; ctx.fillText(this.emoji,this.x-20,this.y+20) }
  }
  update(){ this.y+=this.speed; this.draw() }
}

class Piece{
  constructor(x,y,emoji,dir){ this.x=x; this.y=y; this.vx=dir*4; this.vy=-5; this.gravity=0.4; this.emoji=emoji }
  draw(){ ctx.font="40px Arial"; ctx.fillText(this.emoji,this.x,this.y) }
  update(){ this.vy+=this.gravity; this.x+=this.vx; this.y+=this.vy; this.draw() }
}

function spawnItem(){ if(!gameRunning) return; let x=Math.random()*(canvas.width-60)+30; items.push(new Item(x)) }
function updateLives(){ let hearts=""; for(let i=0;i<lives;i++) hearts+="❤️"; livesText.innerText="Lives: "+hearts }

function gameOver(){
  gameRunning=false
  bgMusic.pause()
  bgMusic.currentTime=0
  ctx.fillStyle="rgba(0,0,0,0.6)"
  ctx.fillRect(0,0,canvas.width,canvas.height)
  ctx.fillStyle="red"; ctx.font="60px Arial"; ctx.textAlign="center"
  ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2)
  restartBtn.style.display="block"
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height)
  drawTrail()
  for(let i=items.length-1;i>=0;i--){
    items[i].update()
    if(mouseDown){
      let dx=mouseX-items[i].x, dy=mouseY-items[i].y
      let dist=Math.sqrt(dx*dx+dy*dy)
      if(dist<items[i].radius){
        if(items[i].type==="fruit"){
          cutSound.play()
          score++; scoreText.innerText="Score: "+score
          pieces.push(new Piece(items[i].x,items[i].y,items[i].emoji,-1))
          pieces.push(new Piece(items[i].x,items[i].y,items[i].emoji,1))
          if(score>highScore){ highScore=score; localStorage.setItem("fruitHighScore",highScore); highScoreText.innerText="High Score: "+highScore }
          items.splice(i,1)
          continue
        } else { blastSound.play(); gameOver(); return }
      }
    }
    if(items[i].y>canvas.height){ if(items[i].type==="fruit"){ lives--; updateLives(); if(lives<=0){ gameOver(); return } } items.splice(i,1) }
  }
  for(let i=pieces.length-1;i>=0;i--){ pieces[i].update(); if(pieces[i].y>canvas.height) pieces.splice(i,1) }
  if(gameRunning) requestAnimationFrame(animate)
}

// MOUSE / TOUCH
canvas.addEventListener("mousemove", e=>{ mouseX=e.clientX; mouseY=e.clientY; if(mouseDown){ trail.push({x:mouseX,y:mouseY}); if(trail.length>10) trail.shift() } })
canvas.addEventListener("mousedown", ()=>{ mouseDown=true; trail=[] })
canvas.addEventListener("mouseup", ()=>{ mouseDown=false; trail=[] })
canvas.addEventListener("touchmove", e=>{ mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; if(mouseDown){ trail.push({x:mouseX,y:mouseY}); if(trail.length>10) trail.shift() } })
canvas.addEventListener("touchstart", ()=>{ mouseDown=true; trail=[] })
canvas.addEventListener("touchend", ()=>{ mouseDown=false; trail=[] })

// START GAME
startBtn.onclick=function(){ startBtn.style.display="none"; gameRunning=true; bgMusic.play(); animate() }
// RESTART GAME
restartBtn.onclick=function(){
  score=0; lives=3; items=[]; pieces=[]; speed=3
  scoreText.innerText="Score: 0"; updateLives()
  restartBtn.style.display="none"
  bgMusic.currentTime=0; bgMusic.play()
  gameRunning=true; animate()
}

updateLives()
setInterval(spawnItem,1000)
</script>

</body>
</html>
