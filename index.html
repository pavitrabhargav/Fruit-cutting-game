<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fruit Cutting Game</title>

<style>

body{
margin:0;
overflow:hidden;
background:#1e90ff;
}

canvas{
display:block;
}

#score{
position:absolute;
top:10px;
left:20px;
font-size:24px;
color:white;
}

</style>
</head>

<body>

<div id="score">Score:0</div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas=document.getElementById("gameCanvas")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let fruits=[]
let pieces=[]
let score=0

let mouseX=0
let mouseY=0
let slicing=false

/* FRUIT LIST */

let fruitEmoji=["🍎","🍉","🍊","🍌","🍍","🥝"]

class Fruit{

constructor(){

this.x=Math.random()*canvas.width
this.y=canvas.height+50

this.vx=(Math.random()-0.5)*6
this.vy=-(10+Math.random()*5)

this.gravity=0.3

this.radius=30

this.emoji=fruitEmoji[Math.floor(Math.random()*fruitEmoji.length)]

this.cut=false

}

draw(){

ctx.font="50px Arial"
ctx.fillText(this.emoji,this.x-20,this.y+20)

}

update(){

this.vy+=this.gravity

this.x+=this.vx
this.y+=this.vy

this.draw()

}

}

/* PIECES AFTER CUT */

class Piece{

constructor(x,y,vx,vy,emoji){

this.x=x
this.y=y
this.vx=vx
this.vy=vy
this.gravity=0.3
this.emoji=emoji

}

draw(){

ctx.font="40px Arial"
ctx.fillText(this.emoji,this.x,this.y)

}

update(){

this.vy+=this.gravity

this.x+=this.vx
this.y+=this.vy

this.draw()

}

}

/* SPAWN FRUIT */

function spawnFruit(){

fruits.push(new Fruit())

}

setInterval(spawnFruit,1200)

/* SLICE TRAIL */

let trail=[]

function drawTrail(){

ctx.beginPath()

for(let i=0;i<trail.length;i++){

ctx.lineTo(trail[i].x,trail[i].y)

}

ctx.strokeStyle="white"
ctx.lineWidth=5
ctx.stroke()

}

/* GAME LOOP */

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

for(let i=fruits.length-1;i>=0;i--){

let f=fruits[i]

f.update()

let dx=mouseX-f.x
let dy=mouseY-f.y
let dist=Math.sqrt(dx*dx+dy*dy)

if(dist<f.radius && slicing && !f.cut){

f.cut=true

score++
document.getElementById("score").innerText="Score:"+score

/* CREATE TWO PIECES */

pieces.push(new Piece(f.x,f.y,-4,-6,f.emoji))
pieces.push(new Piece(f.x,f.y,4,-6,f.emoji))

fruits.splice(i,1)

}

if(f.y>canvas.height+100){

fruits.splice(i,1)

}

}

/* DRAW PIECES */

for(let i=pieces.length-1;i>=0;i--){

pieces[i].update()

if(pieces[i].y>canvas.height+100){

pieces.splice(i,1)

}

}

drawTrail()

requestAnimationFrame(animate)

}

animate()

/* MOUSE */

canvas.addEventListener("mousemove",e=>{

mouseX=e.clientX
mouseY=e.clientY

if(slicing){

trail.push({x:mouseX,y:mouseY})

if(trail.length>10) trail.shift()

}

})

canvas.addEventListener("mousedown",()=>{

slicing=true
trail=[]

})

canvas.addEventListener("mouseup",()=>{

slicing=false
trail=[]

})

/* TOUCH */

canvas.addEventListener("touchmove",e=>{

mouseX=e.touches[0].clientX
mouseY=e.touches[0].clientY

if(slicing){

trail.push({x:mouseX,y:mouseY})

if(trail.length>10) trail.shift()

}

})

canvas.addEventListener("touchstart",()=>{

slicing=true
trail=[]

})

canvas.addEventListener("touchend",()=>{

slicing=false
trail=[]

})

</script>

</body>
</html>
